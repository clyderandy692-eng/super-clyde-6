name: CI

# Sur chaque poussée et chaque proposition de fusion : une règle métier cassée
# doit se voir avant la fusion, pas en production chez un commerçant.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Le type-check est séparé du build : il échoue plus vite et désigne
      # l'erreur avec plus de précision qu'une compilation Next complète.
      - name: Types
        run: pnpm exec tsc --noEmit

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build
